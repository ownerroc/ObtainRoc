name: Build and Release

on:
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: Is beta?

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Flutter Doctor
        id: flutter_doctor
        run: |
          flutter doctor -v

      - name: Check submodule
        run: |
          git submodule update --init --recursive

      - name: Extract Version
        id: extract_version      
        run: |
          VERSION=$(grep -oP "^version: [^\+]+" pubspec.yaml | tail -c +10)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ ${{ inputs.beta }} == true ]; then BETA=true; else BETA=false; fi
          echo "beta=$BETA" >> $GITHUB_OUTPUT
          TAG="v$VERSION"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Decode Release Keystore
        env:
          OBTAINROC_KEYSTORE_BASE64: ${{ secrets.OBTAINROC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$OBTAINROC_KEYSTORE_BASE64" ]; then
            printf '%s' "$OBTAINROC_KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          else
            echo "No keystore secret set - builds will be unsigned"
          fi

      - name: Write key.properties
        run: |
          if [ -f android/app/release-keystore.jks ]; then
            cat > android/key.properties <<EOF
          storeFile=app/release-keystore.jks
          storePassword=${{ secrets.OBTAINROC_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.OBTAINROC_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.OBTAINROC_KEYSTORE_ALIAS }}
          EOF
          fi

      - name: Build APKs
        run: |
          flutter pub get
          # TODO: Remove once Flutter's libdartjni.so no longer embeds a non-reproducible build ID
          sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${PUB_CACHE:-$HOME/.pub-cache}/hosted/*/jni-*/src/CMakeLists.txt
          # If the keystore secret was decoded above, key.properties is present
          # and build.gradle.kts signs the release APKs automatically.
          # Without it, signingConfig = null and APKs are unsigned.
          flutter build apk --flavor normal && flutter build apk --split-per-abi --flavor normal
          for file in build/app/outputs/flutter-apk/app-*normal*.apk*; do mv "$file" "${file//-normal/}"; done
          flutter build apk --flavor fdroid -t lib/main_fdroid.dart && flutter build apk --split-per-abi --flavor fdroid -t lib/main_fdroid.dart
          rm -f ./build/app/outputs/flutter-apk/*.sha1
          cp ./sign.sh ./build/app/outputs/flutter-apk/
          ls -l ./build/app/outputs/flutter-apk/

      - name: Clean Up Keystore
        if: always()
        run: rm -f android/app/release-keystore.jks android/key.properties

      - name: Save Unsigned APKs as Action Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          path: build/app/outputs/flutter-apk/*

      # Tag/draft-release steps disabled in the ObtainRoc fork: upstream's
      # GH_ACCESS_TOKEN secret is not set here. APKs ship as workflow artifacts.
